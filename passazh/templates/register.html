{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2> Регистрация</h2>
    <form method="POST" class="app-form" id="registerForm">
        <div class="form-group">
            <label> Логин *</label>
            <input type="text" name="login" required pattern="[a-zA-Z0-9]{6,}" 
                   title="Латинские буквы и цифры, минимум 6 символов" placeholder="например: ivanov2024">
            <small class="form-hint">Только латинские буквы и цифры, не менее 6 символов</small>
        </div>
        <div class="form-group">
            <label> Пароль *</label>
            <input type="password" name="password" required minlength="8" placeholder="Минимум 8 символов">
            <small class="form-hint">Минимум 8 символов</small>
        </div>
        <div class="form-group">
            <label> ФИО *</label>
            <input type="text" name="full_name" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
            <label> Дата рождения *</label>
            <input type="date" name="birth_date" required>
        </div>
        <div class="form-group">
            <label> Телефон *</label>
            <input type="tel" name="phone" required placeholder="+7 (999) 123-45-67">
        </div>
        <div class="form-group">
            <label> E-mail *</label>
            <input type="email" name="email" required placeholder="ivanov@example.com">
        </div>
        <button type="submit" class="btn-primary btn-block"> Зарегистрироваться</button>
    </form>
    <p class="form-footer">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
{% endblock %}
