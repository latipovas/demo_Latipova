{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2><i class="fas fa-sign-in-alt"></i> Вход в систему</h2>
    <form method="POST" class="app-form">
        <div class="form-group">
            <label><i class="fas fa-user"></i> Логин</label>
            <input type="text" name="login" required placeholder="Введите логин">
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> Пароль</label>
            <input type="password" name="password" required placeholder="Введите пароль">
        </div>
        <button type="submit" class="btn-primary btn-block"><i class="fas fa-arrow-right"></i> Войти</button>
    </form>
    <p class="form-footer">Ещё не зарегистрированы? <a href="{{ url_for('register') }}">Регистрация</a></p>
</div>
{% endblock %}
